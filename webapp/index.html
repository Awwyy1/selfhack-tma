<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SelfHack AI Coach</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      padding: 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-bottom: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999);
    }
    
    .content {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    
    .page {
      display: none;
      height: 100%;
      padding: 16px;
    }
    
    .page.active {
      display: block;
    }
    
    #chat-page {
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    
    .message {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    
    .message.user {
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      margin-left: auto;
      text-align: right;
    }
    
    .message.assistant {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000);
    }
    
    .input-area {
      padding: 12px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
    }
    
    #message-input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-size: 16px;
    }
    
    #send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 20px;
      cursor: pointer;
    }
    
    #send-btn:active {
      opacity: 0.7;
    }
    
    .navigation {
      display: flex;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-top: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
      padding: 4px 0;
    }
    
    .nav-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 4px;
      border: none;
      background: transparent;
      color: var(--tg-theme-hint-color, #999);
      font-size: 12px;
      cursor: pointer;
    }
    
    .nav-btn.active {
      color: var(--tg-theme-button-color, #3390ec);
      font-weight: 600;
    }
    
    .placeholder-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--tg-theme-hint-color, #999);
    }
    
    .placeholder-content .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .placeholder-content h2 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--tg-theme-text-color, #000);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 SelfHack</h1>
    <p id="user-name">Загрузка...</p>
  </div>
  
  <div class="content">
    <!-- Страница Чекин -->
    <div id="checkin-page" class="page">
      <div class="placeholder-content">
        <div class="icon">✓</div>
        <h2>Чекин</h2>
        <p>Отметь свой прогресс каждый день</p>
      </div>
    </div>
    
    <!-- Страница Стиль -->
    <div id="style-page" class="page">
      <div class="placeholder-content">
        <div class="icon">🎨</div>
        <h2>Стиль общения</h2>
        <p>Настрой как я буду с тобой общаться</p>
      </div>
    </div>
    
    <!-- Страница Чат -->
    <div id="chat-page" class="page active">
      <div id="chat-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Напиши что-то...">
        <button id="send-btn">→</button>
      </div>
    </div>
    
    <!-- Страница Цели -->
    <div id="goals-page" class="page">
      <div class="placeholder-content">
        <div class="icon">🎯</div>
        <h2>Цели</h2>
        <p>Твои цели и прогресс</p>
      </div>
    </div>
    
    <!-- Страница Профиль -->
    <div id="profile-page" class="page">
      <div class="placeholder-content">
        <div class="icon">👤</div>
        <h2>Профиль</h2>
        <p>Настройки и подписка</p>
      </div>
    </div>
  </div>
  
  <div class="navigation">
    <button class="nav-btn" data-page="checkin">
      <span>Чекин</span>
    </button>
    <button class="nav-btn" data-page="style">
      <span>Стиль</span>
    </button>
    <button class="nav-btn active" data-page="chat">
      <span>Чат</span>
    </button>
    <button class="nav-btn" data-page="goals">
      <span>Цели</span>
    </button>
    <button class="nav-btn" data-page="profile">
      <span>Профиль</span>
    </button>
  </div>
  
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    
    const user = tg.initDataUnsafe?.user;
    const userName = document.getElementById('user-name');
    userName.textContent = user ? `@${user.username || user.first_name}` : 'Guest';
    
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    // Навигация
    const navBtns = document.querySelectorAll('.nav-btn');
    const pages = document.querySelectorAll('.page');
    
    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const pageName = btn.dataset.page;
        
        // Убрать active со всех кнопок и страниц
        navBtns.forEach(b => b.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));
        
        // Добавить active к выбранным
        btn.classList.add('active');
        document.getElementById(`${pageName}-page`).classList.add('active');
      });
    });
    
    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      
      addMessage(message, 'user');
      messageInput.value = '';
      sendBtn.disabled = true;
      
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': tg.initData
          },
          body: JSON.stringify({
            message: message,
            user_id: user?.id || 0
          })
        });
        
        const data = await response.json();
        addMessage(data.message || data.reply || 'Ошибка ответа', 'assistant');
        
      } catch (error) {
        console.error('Error:', error);
        addMessage('Ошибка. Попробуй ещё раз.', 'assistant');
      } finally {
        sendBtn.disabled = false;
      }
    }
    
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    
    // Загрузка истории при старте
    async function loadHistory() {
      try {
        const response = await fetch(`/api/history?user_id=${user?.id || 0}`, {
          headers: { 'X-Telegram-Init-Data': tg.initData }
        });
        const data = await response.json();
        
        if (data.history && data.history.length > 0) {
          data.history.forEach(msg => {
            addMessage(msg.content, msg.role);
          });
        } else {
          addMessage('Привет! Я SelfHack. Чем могу помочь?', 'assistant');
        }
      } catch (error) {
        console.error('Load history error:', error);
        addMessage('Привет! Я SelfHack. Чем могу помочь?', 'assistant');
      }
    }

    loadHistory();
  </script>
</body>
</html>
