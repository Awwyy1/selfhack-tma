<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SelfHack AI Coach</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      padding: 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-bottom: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999);
    }
    
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    
    .message {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    
    .message.user {
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      margin-left: auto;
      text-align: right;
    }
    
    .message.assistant {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000);
    }
    
    .input-area {
      padding: 12px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
    }
    
    #message-input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-size: 16px;
    }
    
    #send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 20px;
      cursor: pointer;
    }
    
    #send-btn:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 SelfHack</h1>
    <p id="user-name">Загрузка...</p>
  </div>
  
  <div id="chat-container"></div>
  
  <div class="input-area">
    <input type="text" id="message-input" placeholder="Напиши что-то...">
    <button id="send-btn">→</button>
  </div>
  
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    
    const user = tg.initDataUnsafe?.user;
    const userName = document.getElementById('user-name');
    userName.textContent = user ? `@${user.username || user.first_name}` : 'Guest';
    
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      
      addMessage(message, 'user');
      messageInput.value = '';
      sendBtn.disabled = true;
      
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Telegram-Init-Data': tg.initData
          },
          body: JSON.stringify({
            message: message,
            user_id: user?.id || 0
          })
        });
        
        const data = await response.json();
        addMessage(data.message || data.reply || 'Ошибка ответа', 'assistant');
        
      } catch (error) {
        console.error('Error:', error);
        addMessage('Ошибка. Попробуй ещё раз.', 'assistant');
      } finally {
        sendBtn.disabled = false;
      }
    }
    
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    
    addMessage('Привет! Я SelfHack. Чем могу помочь?', 'assistant');
  </script>
</body>
</html>
